<svg xmlns="http://www.w3.org/2000/svg" width="876" height="978" viewBox="0 0 876 978" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#000"><defs><marker id="seta" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><path d="M430.0,130.0 L430.0,176.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M430.0,245.5 L430.0,291.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M540.0,365.5 L579.5,365.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M430.0,439.5 L430.0,493.8" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M320.0,536.8 L264.0,536.8" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M430.0,579.8 L430.0,634.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M154.0,588.0 L154.0,611.0 L430.0,611.0 L430.0,634.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M430.0,720.0 L430.0,766.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M320.0,809.0 L292.0,809.0 L292.0,898.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M540.0,809.0 L568.0,809.0 L568.0,898.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><rect x="309.0" y="44.0" width="242.0" height="86.0" rx="43.0" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/><text x="430.0" y="66.9" text-anchor="middle" font-weight="bold">Gestante até 13+6 semanas com</text><text x="430.0" y="83.4" text-anchor="middle" font-weight="bold">sangramento vaginal ou</text><text x="430.0" y="99.9" text-anchor="middle" font-weight="bold">encaminhada com diagnóstico de</text><text x="430.0" y="116.4" text-anchor="middle" font-weight="bold">gestação não evolutiva</text><rect x="320.0" y="176.0" width="220.0" height="69.5" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="430.0" y="198.9" text-anchor="middle">Acolhimento, sinais vitais,</text><text x="430.0" y="215.4" text-anchor="middle">exame especular (sem toque</text><text x="430.0" y="231.9" text-anchor="middle">bimanual), exames de admissão</text><polygon points="430.0,291.5 540.0,365.5 430.0,439.5 320.0,365.5" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.6"/><text x="430.0" y="345.4" text-anchor="middle">Instável,</text><text x="430.0" y="361.9" text-anchor="middle">sangramento</text><text x="430.0" y="378.4" text-anchor="middle">intenso ou sinais</text><text x="430.0" y="394.9" text-anchor="middle">de infecção?</text><rect x="579.5" y="297.8" width="253.0" height="135.5" rx="4" fill="#F8D7DA" stroke="#9C1C24" stroke-width="1.6"/><text x="706.0" y="320.7" text-anchor="middle" font-weight="bold">URGÊNCIA. Sangramento uterino</text><text x="706.0" y="337.2" text-anchor="middle" font-weight="bold">intenso ao especular ou infecção →</text><text x="706.0" y="353.7" text-anchor="middle" font-weight="bold">Figura 4, ramo A (USG só se não</text><text x="706.0" y="370.2" text-anchor="middle" font-weight="bold">atrasar). Dor/sinais peritoneais</text><text x="706.0" y="386.7" text-anchor="middle" font-weight="bold">com pouco sangramento vaginal →</text><text x="706.0" y="403.2" text-anchor="middle" font-weight="bold">suspeita de ectópica rota: sai do</text><text x="706.0" y="419.7" text-anchor="middle" font-weight="bold">protocolo, equipe cirúrgica</text><polygon points="430.0,493.8 540.0,536.8 430.0,579.8 320.0,536.8" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.6"/><text x="430.0" y="533.2" text-anchor="middle">USG disponível</text><text x="430.0" y="549.7" text-anchor="middle">agora?</text><rect x="44.0" y="485.5" width="220.0" height="102.5" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="154.0" y="508.4" text-anchor="middle">Sem USG: aguardar em casa</text><text x="154.0" y="524.9" text-anchor="middle">SOMENTE se sem dor, IG &lt; 6</text><text x="154.0" y="541.4" text-anchor="middle">semanas e sem fator de risco</text><text x="154.0" y="557.9" text-anchor="middle">para ectópica. Demais:</text><text x="154.0" y="574.4" text-anchor="middle">internar até o USG</text><rect x="320.0" y="634.0" width="220.0" height="86.0" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="430.0" y="656.9" text-anchor="middle">USG transvaginal: CCN, DMSG,</text><text x="430.0" y="673.4" text-anchor="middle">vesícula vitelina, BCF;</text><text x="430.0" y="689.9" text-anchor="middle">imagens anexadas ao</text><text x="430.0" y="706.4" text-anchor="middle">prontuário</text><polygon points="430.0,766.0 540.0,809.0 430.0,852.0 320.0,809.0" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.6"/><text x="430.0" y="805.4" text-anchor="middle">Saco gestacional</text><text x="430.0" y="821.9" text-anchor="middle">intrauterino?</text><rect x="204.0" y="898.0" width="176.0" height="36.5" rx="18.2" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/><text x="292.0" y="920.9" text-anchor="middle" font-weight="bold">Figura 2</text><rect x="480.0" y="898.0" width="176.0" height="36.5" rx="18.2" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/><text x="568.0" y="920.9" text-anchor="middle" font-weight="bold">Figura 3</text><text x="552.0" y="359.5" text-anchor="start" font-weight="bold" font-size="12">Sim</text><text x="437.0" y="454.5" font-weight="bold" font-size="12">Não</text><text x="308.0" y="530.8" text-anchor="end" font-weight="bold" font-size="12">Não</text><text x="437.0" y="594.8" font-weight="bold" font-size="12">Sim</text><text x="161.0" y="603.0" font-weight="bold" font-size="12">no retorno</text><text x="308.0" y="803.0" text-anchor="end" font-weight="bold" font-size="12">Sim</text><text x="552.0" y="803.0" text-anchor="start" font-weight="bold" font-size="12">Não</text></svg>