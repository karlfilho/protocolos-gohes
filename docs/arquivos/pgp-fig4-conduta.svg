<svg xmlns="http://www.w3.org/2000/svg" width="932" height="884" viewBox="0 0 932 884" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#000"><defs><marker id="seta" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><path d="M154.0,113.5 L154.0,159.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M568.0,113.5 L568.0,169.8" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M678.0,227.2 L788.8,227.2 L788.8,349.2" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M458.0,227.2 L457.6,227.2 L457.6,341.0" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M457.6,443.5 L457.6,489.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M347.6,532.5 L236.8,532.5 L236.8,629.8" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M567.6,532.5 L678.4,532.5 L678.4,621.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M236.8,699.2 L236.8,730.5 L457.6,730.5 L457.6,753.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><path d="M678.4,707.5 L678.4,730.5 L457.6,730.5 L457.6,753.5" fill="none" stroke="#262626" stroke-width="1.5" marker-end="url(#seta)"/><rect x="66.0" y="44.0" width="176.0" height="69.5" rx="34.8" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/><text x="154.0" y="66.9" text-anchor="middle" font-weight="bold">Urgência hemorrágica</text><text x="154.0" y="83.4" text-anchor="middle" font-weight="bold">ou infecciosa (Figura</text><text x="154.0" y="99.9" text-anchor="middle" font-weight="bold">1)</text><rect x="44.0" y="159.5" width="220.0" height="135.5" rx="4" fill="#F8D7DA" stroke="#9C1C24" stroke-width="1.6"/><text x="154.0" y="182.4" text-anchor="middle" font-weight="bold">A. Estabilizar; se infecção,</text><text x="154.0" y="198.9" text-anchor="middle" font-weight="bold">gentamicina + clindamicina</text><text x="154.0" y="215.4" text-anchor="middle" font-weight="bold">EV; aspiração (curetagem só</text><text x="154.0" y="231.9" text-anchor="middle" font-weight="bold">se indisponível); USG só se</text><text x="154.0" y="248.4" text-anchor="middle" font-weight="bold">não atrasar; justificar em</text><text x="154.0" y="264.9" text-anchor="middle" font-weight="bold">prontuário a dispensa do</text><text x="154.0" y="281.4" text-anchor="middle" font-weight="bold">formulário</text><rect x="447.0" y="44.0" width="242.0" height="69.5" rx="34.8" fill="#DCE6F2" stroke="#1F3864" stroke-width="1.6"/><text x="568.0" y="66.9" text-anchor="middle" font-weight="bold">Perda gestacional confirmada —</text><text x="568.0" y="83.4" text-anchor="middle" font-weight="bold">retido ou incompleto (Figuras 2</text><text x="568.0" y="99.9" text-anchor="middle" font-weight="bold">e 3)</text><polygon points="568.0,169.8 678.0,227.2 568.0,284.8 458.0,227.2" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.6"/><text x="568.0" y="215.4" text-anchor="middle">Expectante</text><text x="568.0" y="231.9" text-anchor="middle">aceitável e sem</text><text x="568.0" y="248.4" text-anchor="middle">contraindicação?</text><rect x="689.8" y="349.2" width="198.0" height="86.0" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="788.8" y="372.2" text-anchor="middle">B. Expectante 7–14 dias:</text><text x="788.8" y="388.7" text-anchor="middle">alta com orientação</text><text x="788.8" y="405.2" text-anchor="middle">escrita e retorno agendado</text><text x="788.8" y="421.7" text-anchor="middle">ao PA/CO com USG</text><rect x="347.6" y="341.0" width="220.0" height="102.5" rx="4" fill="#F8D7DA" stroke="#9C1C24" stroke-width="1.6"/><text x="457.6" y="363.9" text-anchor="middle" font-weight="bold">Formulário de critérios</text><text x="457.6" y="380.4" text-anchor="middle" font-weight="bold">(Anexo 1) carimbado pelo</text><text x="457.6" y="396.9" text-anchor="middle" font-weight="bold">médico assistente e por outro</text><text x="457.6" y="413.4" text-anchor="middle" font-weight="bold">médico do plantão (não</text><text x="457.6" y="429.9" text-anchor="middle" font-weight="bold">residente)</text><polygon points="457.6,489.5 567.6,532.5 457.6,575.5 347.6,532.5" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.6"/><text x="457.6" y="537.2" text-anchor="middle">Via escolhida</text><rect x="126.8" y="629.8" width="220.0" height="69.5" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="236.8" y="652.7" text-anchor="middle">C. Misoprostol 800 mcg</text><text x="236.8" y="669.2" text-anchor="middle">vaginal, até 3 doses</text><text x="236.8" y="685.7" text-anchor="middle">(intervalo ≥ 3h), internada</text><rect x="568.4" y="621.5" width="220.0" height="86.0" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="678.4" y="644.4" text-anchor="middle">D. Aspiração (AMIU/elétrica);</text><text x="678.4" y="660.9" text-anchor="middle">curetagem só se indisponível.</text><text x="678.4" y="677.4" text-anchor="middle">Doxiciclina 200 mg VO até 2h</text><text x="678.4" y="693.9" text-anchor="middle">antes</text><rect x="303.6" y="753.5" width="308.0" height="86.0" rx="4" fill="#FFFFFF" stroke="#262626" stroke-width="1.6"/><text x="457.6" y="776.4" text-anchor="middle">Todas: anatomopatológico · anti-D se Rh(−)</text><text x="457.6" y="792.9" text-anchor="middle">e ≥ 12 semanas · analgesia · acolhimento ·</text><text x="457.6" y="809.4" text-anchor="middle">orientação escrita · teste urinário em 3</text><text x="457.6" y="825.9" text-anchor="middle">semanas</text><text x="690.0" y="221.2" text-anchor="start" font-weight="bold" font-size="12">Sim</text><text x="446.0" y="221.2" text-anchor="end" font-weight="bold" font-size="12">Não</text><text x="335.6" y="526.5" text-anchor="end" font-weight="bold" font-size="12">Medicamentosa</text><text x="579.6" y="526.5" text-anchor="start" font-weight="bold" font-size="12">Cirúrgica</text></svg>