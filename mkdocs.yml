site_name: Tocoginecologia HES
site_description: Protocolos assistenciais, treinamento e wiki da Ginecologia e Obstetrícia do Hospital Estadual de Sumaré
site_url: https://karlfilho.github.io/protocolos-gohes/
copyright: >
  Coordenação Médica de Tocoginecologia — Hospital Estadual de Sumaré ·
  Material de apoio: não substitui o julgamento clínico ·
  <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.pt-br">CC BY-NC 4.0</a> ·
  <a href="mailto:karl.filho@funcamp.unicamp.br">Fale conosco</a>

docs_dir: docs
edit_uri: ""
exclude_docs: |
  _modelos/
draft_docs: |
  Para revisar/

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
  favicon: arquivos/favicon.svg
  palette:                     # o menu de temas fica em overrides/partials/palette.html
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: nord
      accent: nord
      toggle:
        icon: material/brightness-auto
        name: Automático (segue o sistema)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: nord
      accent: nord
      toggle:
        icon: material/palette-outline
        name: Nord
    - scheme: default
      primary: latte
      accent: latte
      toggle:
        icon: material/palette-outline
        name: Catppuccin Latte
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: tokyo
      accent: tokyo
      toggle:
        icon: material/palette-outline
        name: Tokyo Night
    - scheme: slate
      primary: retro
      accent: retro
      toggle:
        icon: material/palette-outline
        name: Retro 82
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.tooltips
    - content.footnote.tooltips

extra_css:
  - stylesheets/nord.css

extra_javascript:
  - javascripts/calculadoras.js
  - javascripts/tema.js
  - javascripts/questoes.js
  - javascripts/textos.js

extra:
  generator: false
  ordem_menu: [Para revisar, index, Protocolos, Textos-padrão, Fluxos, Ferramentas, Treinamento, Wiki, Questões, Novidades, Sobre, Fale conosco]

hooks:
  - hooks/wiki.py

plugins:
  - search:
      lang: pt
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - nl2br
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde:
      subscript: false
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
